<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rapisabor - Comidas Rápidas</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header>
    <img src="https://assets.onecompiler.app/43ftuv7vk/43ftuyhb4/mmm.jpg" alt="Logo Rapisabor" class="logo" title="Mmm... combos 😋" />
    <h1>🍟 Rapisabor</h1>
    <p>¡Combos que te dejan feliz!</p>
  </header>

  <section class="menu" id="menu"></section>

  <section class="cart">
    <h2>🛒 Carrito</h2>
    <ul id="cart-items"></ul>
    <p><strong>Total: $<span id="total">0</span></strong></p>
  </section>

  <section id="payment-methods" style="display: none;">
    <h3>Seleccione método de pago:</h3>
    <button onclick="seleccionarPago('tarjeta')">Tarjeta</button>
    <button onclick="seleccionarPago('efectivo')">Efectivo</button>
  </section>

  <section id="card-form" style="display: none;">
    <h3>Pago con tarjeta</h3>
    <form onsubmit="validarTarjeta(event)">
      <label>
        Nombre en la tarjeta:
        <input type="text" id="card-name" required />
      </label><br />
      <label>
        Número de tarjeta:
        <input type="text" id="card-number" maxlength="16" required />
      </label><br />
      <label>
        Fecha de expiración:
        <input type="month" id="card-expiry" required />
      </label><br />
      <label>
        CVV:
        <input type="text" id="card-cvv" maxlength="3" required />
      </label><br />
      <button type="submit">Pagar</button>
    </form>
  </section>

  <section id="cash-info" style="display: none;">
    <p>💵 Recuerde que debe pagar el domicilio al llegar el pedido.</p>
  </section>

  <audio id="homeroSound" src="sounds/homero.mp3" preload="auto"></audio>
  <script src="script.js"></script>

</body>
</html>
